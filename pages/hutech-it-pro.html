<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài khoản HUTECH IT Pro</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/depth-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
        <span class="logo-text">HUTECH <strong>IT Pro</strong></span>
      </a>
      <div class="header-right">
        <span class="user-name" id="vipAccountName"></span>
        <button class="btn btn-outline" id="vipLogout">Đăng xuất</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding:40px 16px;">
    <section class="form-card" style="max-width:640px;margin:auto;background:#fff;border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:var(--shadow);">
      <span class="badge-status dang-tuyen">Tài khoản khách hàng VIP</span>
      <h1 style="margin:16px 0 8px;">Chào mừng đến với HUTECH IT Pro</h1>
      <p style="color:var(--text-muted);">Bạn đã đăng nhập bằng tài khoản khách hàng VIP.</p>
      <p style="margin-top:16px;"><i class="fas fa-envelope"></i> <span id="vipAccountEmail"></span></p>
      <a href="../index.html" class="btn btn-primary" style="margin-top:24px;">Về trang chủ</a>
    </section>
  </main>

  <script src="../css/js/data.js"></script>
  <script src="../css/js/common.js?v=2"></script>
  <script src="../css/js/portal.js?v=2"></script>
</body>
</html>
